# Capella POS — AppVeyor build config
#
# ⚠ This file's home is the ROOT of the PUBLIC releases repo
#   (trashad2392/capella-pos-releases) as `appveyor.yml`.
#   The copy in the source repo (scripts/appveyor-releases-repo.yml) is the
#   master — when you change it, paste the new version into the releases repo.
#
# How it works: AppVeyor (free for public repos) is attached to the public
# releases repo. The build clones the PRIVATE source repo using the GH_TOKEN
# secure variable, builds the Windows installer, runs packaged-app smoke
# tests against the output (a failed test BLOCKS the upload), then
# scripts/publish-release.js uploads the release (exe + blockmap + latest.yml)
# back to the public releases repo — named v<version> from package.json.
#
# Smoke tests (tests/e2e/ in the source repo):
#   1. packaged-boot.spec.js — boots the real release artifact (dist/, real
#      license); asserts the Activation screen renders (catches packaged-only
#      renderer regressions).
#   2. deep-flow.spec.js — boots the license-skipped, UNOBFUSCATED test build
#      (dist-test/); drives onboarding → PIN login → shift gate → POS home.
#      Cheap sanity check that the app logic itself works, independent of
#      obfuscation.
#   3. wide-flow.spec.js — the obfuscation regression gate (written
#      2026-08-07; this file described it before it existed). Runs the SAME
#      journey — 10-step onboarding → shift open → back office (discount +
#      drive-thru lane) → takeaway order with an order-level discount → Fast
#      Cash → on-screen receipt → split payment across two methods →
#      drive-thru lane queue board — against BOTH dist-test/ (unobfuscated)
#      and dist-test-obfuscated/ (obfuscated, built with the real
#      obfuscate-renderer.js step). Credit Sale is deliberately not covered
#      (needs a Customer with a credit limit; PaymentModal is already
#      exercised by the split leg). Since obfuscation is supposed to be
#      semantics-preserving, any pass/fail divergence between the two runs is
#      a miscompilation — this is what would have caught the 2026-07-16
#      print/receipt incident (see CLAUDE.md "App Protection Layer") before it
#      shipped, regardless of which component it hit.
#
# ⚠️ FULLY LIVE SINCE 2026-08-08. Steps 1-5 gate every build and step 6
#    publishes. The live appveyor.yml is byte-identical to this file.
#
#    It was deployed earlier that day as a DRY RUN (releases repo commit
#    e0db2a5) with the publish line commented out, because deploying this file
#    changes TWO things at once — it adds the gates AND switches publishing
#    from electron-builder to publish-release.js, which had never run in CI.
#    Build 43 then cleared steps 1-5 on Windows (packaged-boot 11.3s,
#    deep-flow, wide-flow green across BOTH the plain and obfuscated
#    artifacts), so the publish line was uncommented.
#
#    Until 2026-08-08 the live config was the pre-gate version — whole
#    build_script was `npm run release` (electron-builder --publish always),
#    no smoke tests, no publish-release.js. That is why nothing complained
#    while wide-flow.spec.js did not exist, three specs sat broken against the
#    2026-08-06 wizard rebuild, and resolveExecutable looked for a Capella.exe
#    no Windows build produces: none of it had ever run in CI.
#
# To release: bump the version in the source repo's package.json, push to
# main, then click NEW BUILD on the AppVeyor project page.
#
# Secure variables to set in AppVeyor → project Settings → Environment
# (check "secure" so they are masked in the public build logs):
#   GH_TOKEN            fine-grained PAT — BOTH pos-system-fnb and
#                       capella-pos-releases selected, Contents: Read and
#                       write. It is used twice: to clone the private source
#                       repo in `install:` (needs read there) and by
#                       publish-release.js to upload the release (needs write
#                       on the releases repo). A fine-grained PAT applies ONE
#                       permission set to every repo it selects, so read-only
#                       on the source repo is not expressible in a single
#                       token — it would take a second variable. Set it via
#                       the AppVeyor UI, not the API (see
#                       .claude/RELEASE_RUNBOOK.md "Credentials").
#   LICENSE_SERVER_URL  same value as the GitHub Actions secret
#   LICENSE_HMAC_KEY    same value as the GitHub Actions secret

image: Visual Studio 2022

environment:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

# The releases repo itself has nothing to build with msbuild
build: off
test: off

# Don't rebuild when electron-builder pushes the release tag back to this repo
skip_tags: true

install:
  - ps: Install-Product node 18 x64
  - git clone --depth 1 https://x-access-token:%GH_TOKEN%@github.com/trashad2392/pos-system-fnb.git C:\projects\capella-src
  - cd C:\projects\capella-src
  - npm ci

build_script:
  - cd C:\projects\capella-src
  # 1. Full release build — artifacts land in dist/, nothing published yet
  - npm run build:electron
  # 2. Smoke test the real artifact (boot → Activation screen)
  - npx playwright test tests/e2e/packaged-boot.spec.js
  # 3. License-skipped test variants (reuse prisma/addon/bake from step 1):
  #    dist-test/ (unobfuscated) and dist-test-obfuscated/ (obfuscated) —
  #    both built before either gets tested, since wide-flow.spec.js drives
  #    both in one Playwright invocation.
  #    NEXT_PUBLIC_SKIP_LICENSE is set INLINE on each line, not as a preceding
  #    standalone `set` step. It is a Next.js build-time variable - next build
  #    inlines process.env.NEXT_PUBLIC_* into the client bundle - so it has to
  #    be in the environment of the npm process itself. A separate `set` line
  #    only reaches it if AppVeyor happens to run build_script lines in one
  #    shared cmd session; inline && works either way. It must NOT go in the
  #    top-level `environment:` block, which would bake license-skip into the
  #    real dist/ build that gets published to customers.
  - cmd: set "NEXT_PUBLIC_SKIP_LICENSE=true" && npm run build:electron:test
  - cmd: set "NEXT_PUBLIC_SKIP_LICENSE=true" && npm run build:electron:test:obfuscated
  # 4. Deep smoke test (onboarding → login → shift gate → POS home)
  - npx playwright test tests/e2e/deep-flow.spec.js
  # 5. Wide smoke test — full order/payment/receipt journey, unobfuscated AND
  #    obfuscated builds. Any divergence between the two = a miscompilation,
  #    and blocks the release.
  - npx playwright test tests/e2e/wide-flow.spec.js
  # 6. All green — publish dist/ artifacts to the releases repo.
  #    TO DRY-RUN THIS PIPELINE AGAIN (e.g. after reworking the gates): comment
  #    out the single line below. Steps 1-5 still run and still fail the build if
  #    anything breaks, but nothing is uploaded — which is how you prove the
  #    packaged suite passes on Windows without staking a release on it.
  - node scripts/publish-release.js

# When a gate fails, keep the evidence. Playwright writes error-context.md and
# trace.zip per failed test (see playwright.config.js `screenshot`/`trace`), and
# CI would otherwise discard the whole directory when the machine is torn down.
# launchPackagedApp() already folds the main process's stderr and electron-log
# into the thrown error, so the CI log usually explains a boot failure on its
# own — this is the backstop for anything that needs the trace viewer.
on_failure:
  - ps: |
      $rt = "C:\projects\capella-src\test-results"
      if (Test-Path $rt) {
        $zip = "C:\projects\test-results.zip"
        Compress-Archive -Path $rt -DestinationPath $zip -Force
        Push-AppveyorArtifact $zip -FileName "test-results.zip"
      } else {
        Write-Host "no test-results directory to upload"
      }
